server:
  port: 8080
  tomcat:
    accesslog:
      enabled: true
      directory: access
      prefix: app
      suffix: .log
      rotate: true
      pattern: >-
        {"timestamp":"%t","method":"%m","endpointURI":"%U","status":%s}
spring:
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  devtools:
    add-properties: false
  liquibase:
    change-log: classpath:/config/liquibase/master.xml
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        cache:
          redisson:
            address: redis://127.0.0.1:6379
            username: null
            password: null
            clientName: null
            timeout: 3000
            connectTimeout: 10000
            isClusterServerEnabled: false
            entity:
              expiration:
                time_to_live: 3600000 # TTL set to 1 hour, in millis
                max_idle_time: 3600000 # max idle time set the same as TTL, this could be modified later if needed
          use_second_level_cache: false
          use_query_cache: false
          region:
            factory_class: com.hmg.role.config.RedissonConfig
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  sql:
    init:
      mode: always
  application:
    name: hmg-role-api
  datasource:
    url: jdbc:mysql://localhost:3306/hmgrole?allowPublicKeyRetrieval=true
    username: hmg
    password: hmg # NOSONAR: needed to run tests on local env
    driver-class-name: com.mysql.cj.jdbc.Driver
  config:
    import: aws-secretsmanager:dev/hmgrole/secrets
  cloud:
    aws:
      secretsmanager:
        enabled: false
        region: ap-northeast-2
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  packages-to-scan: com.hmg.role
hmg-role:
  admin:
    api-key: 22ee17bd-699e-4b6b-a30b-e854e6c576c5
    name: SYSTEM
  sdk:
    enabled: false
    dataNotFoundStrategy: RETURN_PERMISSION_DENY
logging:
  level:
    root: info
frontend-domain: http://role-local-domain.hmg.net:3020/
backend-domain: http://localhost:8081
hmg-admin:
  projectCode: "HK1314"
  secretKey: "secretKey"
  decryptKey: "decryptKey"
cdc:
  enabled: false
  timer-grace-millis: 100
  #base-working-path: "${cdc.base-working-path}"
  storage:
    identity:
      provider: S3 # add minio later if necessary
  s3:
    iamAdmin: # may need to differ from S3 policy_item writer user
      accessKey: server-access-key
      secretKey: server-secret-key
    urlOverride: http://localhost:39000
    region: ap-northeast-2 # Seoul
    accessKey: server-access-key
    secretKey: server-secret-key
    bucket: hmgrole-policy-bucket
debezium:
  topic-prefix: hmg_role_policy_items
  mysql:
    # standard MySQL connector properties
    connector: "io.debezium.connector.mysql.MySqlConnector"
    user: debezium
    password: debezium
    server-id: 857      # unique integer
    target-table: hmgrole.rbac_policy_items

    # snapshot behavior (first run = initial snapshot, then stream binlog)
    snapshot-mode: initial                  # or: never / when_needed / always
    snapshot-locking-mode: none             # avoid table locks (see note below)

    # event content
    include-schema-changes: false           # don’t emit DDL change topics
    # Single Message Transform (unwrap) to simplify payloads
    unwrap:
      enabled: true
      add-fields: "op,table,ts_ms"
      drop-tombstones: true

  engine:
    # Debezium Engine state stores
    # offset-storage: org.apache.kafka.connect.storage.FileOffsetBackingStore # currently unused
    # offset-file: "d:\\tmp\\offsets.dat"
    offset-flush-interval-ms: 6000

    # schema-history-internal: io.debezium.storage.file.history.FileSchemaHistory # currently unused
    # schema-history-file: "d:\\tmp\\schemahistory.dat"

    # Engine tuning (AsyncEmbeddedEngine is default from 3.2+)
    # Optional: parallelism knobs depend on connector support
    # engine.max.queue.size: 8192
    # engine.poll.interval.ms: 100
